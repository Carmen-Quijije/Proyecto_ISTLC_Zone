<main class="pagina-auth"><mat-card class="tarjeta-auth"><a class="marca-auth" routerLink="/iniciarSesion"><img src="assets/images/logo.png" alt="ISTLC Zone"><span>ISTLC</span></a><h1>Recuperar contraseña</h1>@if(!codigoEnviado){<p>Ingresa tu correo para recibir un código.</p><form [formGroup]="solicitud" (ngSubmit)="enviar()"><mat-form-field appearance="outline"><mat-label>Correo institucional</mat-label><input matInput type="email" formControlName="email"><mat-icon matSuffix>mail</mat-icon></mat-form-field><button mat-flat-button class="boton-principal" [disabled]="solicitud.invalid||procesando">Enviar código</button></form>}@else{<p>Escribe el código recibido y tu contraseña nueva.</p><form [formGroup]="cambio" (ngSubmit)="cambiar()"><mat-form-field appearance="outline"><mat-label>Código</mat-label><input matInput formControlName="codigo"></mat-form-field><mat-form-field appearance="outline"><mat-label>Nueva contraseña</mat-label><input matInput type="password" formControlName="password"></mat-form-field><mat-form-field appearance="outline"><mat-label>Confirmar contraseña</mat-label><input matInput type="password" formControlName="confirmacion"></mat-form-field><button mat-flat-button class="boton-principal" [disabled]="cambio.invalid||procesando">Cambiar contraseña</button></form>}@if(mensaje){<p [class.mensaje-error]="esError" [class.mensaje-exito]="!esError">{{mensaje}}</p>}<a mat-button routerLink="/iniciarSesion">Volver</a></mat-card></main>
