<!-- Pantalla para solicitar la recuperación de una contraseña. -->
<main class="contenedor-acceso">
  <mat-card class="tarjeta-acceso"
    ><mat-card-header
      ><mat-card-title>Recuperar contraseña</mat-card-title
      ><mat-card-subtitle
        >Te enviaremos instrucciones por correo.</mat-card-subtitle
      ></mat-card-header
    ><mat-card-content
      ><!-- El formulario valida el correo antes de ejecutar enviar(). -->
      <form class="formulario" [formGroup]="formulario" (ngSubmit)="codigoEnviado ? restablecer() : enviar()">
        <mat-form-field
          ><mat-label>Correo</mat-label><input matInput type="email" formControlName="email" [readonly]="codigoEnviado" /></mat-form-field
        >@if (codigoEnviado) {
        <mat-form-field><mat-label>Código de verificación</mat-label><input matInput inputmode="numeric" maxlength="6" formControlName="codigo" /></mat-form-field>
        <mat-form-field><mat-label>Nueva contraseña</mat-label><input matInput type="password" formControlName="password" /></mat-form-field>
        <mat-form-field><mat-label>Confirmar contraseña</mat-label><input matInput type="password" formControlName="confirmarPassword" /></mat-form-field>
        }
        <button mat-flat-button type="submit" [disabled]="claveActualizada">{{ codigoEnviado ? 'Cambiar contraseña' : 'Enviar código' }}</button>
        <a mat-button routerLink="/iniciarSesion">Volver</a>
        <!-- Confirmación que aparece después de procesar la solicitud. -->
        @if (mensaje) {
        <p class="mensaje-exito">{{ mensaje }}</p>
        }
      </form></mat-card-content
    ></mat-card
  >
</main>
