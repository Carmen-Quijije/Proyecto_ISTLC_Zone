<main class="editar-page"><mat-card><header><a mat-icon-button routerLink="/perfil"><mat-icon>arrow_back</mat-icon></a><div><h1>Editar perfil</h1><p>Actualiza tu información personal y académica</p></div></header><form [formGroup]="formulario" (ngSubmit)="guardar()"><section class="foto-editor"><img [src]="fotoPreview" alt="Foto de perfil"><label mat-flat-button class="amarillo"><mat-icon>photo_camera</mat-icon>Cambiar foto<input type="file" accept="image/*" hidden (change)="seleccionarFoto($event)"></label></section><div class="campos"><mat-form-field appearance="outline"><mat-label>Nombre completo</mat-label><input matInput formControlName="nombre"></mat-form-field><mat-form-field appearance="outline"><mat-label>Ciudad actual</mat-label><input matInput formControlName="viveEn"></mat-form-field><mat-form-field appearance="outline"><mat-label>Lugar de origen</mat-label><input matInput formControlName="lugarOrigen"></mat-form-field><mat-form-field appearance="outline"><mat-label>Fecha de nacimiento</mat-label><input matInput type="date" formControlName="fechaNacimiento"></mat-form-field><mat-form-field appearance="outline"><mat-label>Estado civil</mat-label><mat-select formControlName="estadoCivil"><mat-option value="">No especificar</mat-option><mat-option value="Soltero/a">Soltero/a</mat-option><mat-option value="Casado/a">Casado/a</mat-option><mat-option value="En una relación">En una relación</mat-option></mat-select></mat-form-field><mat-form-field appearance="outline"><mat-label>Carrera</mat-label><input matInput formControlName="carrera"></mat-form-field><mat-form-field appearance="outline"><mat-label>Semestre</mat-label><input matInput formControlName="semestre"></mat-form-field><mat-form-field appearance="outline" class="ancho"><mat-label>Biografía</mat-label><textarea matInput rows="4" formControlName="bio"></textarea></mat-form-field></div>@if(mensaje){<p [class.mensaje-error]="esError">{{mensaje}}</p>}<footer><a mat-button routerLink="/perfil">Cancelar</a><button mat-flat-button class="amarillo" type="submit" [disabled]="guardando">{{guardando?'Guardando...':'Guardar cambios'}}</button></footer></form></mat-card></main>
